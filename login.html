<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockMart - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-teal-100 text-teal-600 mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-stone-800">Welcome Back</h2>
                <p class="text-stone-500 text-sm mt-1">Please sign in to your test account</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-stone-700 mb-1">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all" placeholder="Enter 'admin'" required>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-stone-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all" placeholder="Enter 'password'" required>
                </div>
                
                <div id="errorMessage" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-100">
                    Invalid credentials. Try admin / password.
                </div>

                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-lg transition-colors duration-200">
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="index.html" class="text-sm text-teal-600 hover:text-teal-700 font-medium">&larr; Back to Store</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const btn = document.querySelector('button[type="submit"]');
            
            // Reset state
            errorDiv.classList.add('hidden');
            btn.innerHTML = 'Signing in...';
            btn.disabled = true;
            
            // Simulate brief network delay for realism
            setTimeout(() => {
                if(user === 'admin' && pass === 'password') {
                    // Save login state so index.html knows we are authenticated
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('currentUser', user);
                    window.location.href = 'index.html';
                } else {
                    errorDiv.classList.remove('hidden');
                    btn.innerHTML = 'Sign In';
                    btn.disabled = false;
                }
            }, 800);
        }
    </script>
</body>
</html>
